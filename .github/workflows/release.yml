name: Publish stable release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-and-package:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LENOVO_STORE_MAINTENANCE_TOKEN: ''
      LENOVO_STORE_UPDATE_TOKEN: ''
      BAIDU_OCR_API_KEY: ''
      BAIDU_OCR_SECRET_KEY: ''
      OCR_CONFIG_ENCRYPTION_KEY: ''
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release tag
        id: release
        env:
          GITHUB_EVENT_REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: npm run release:verify

      - name: Install locked dependencies
        run: npm ci

      - name: Build all applications
        run: npm run build

      - name: Run repository checks
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Create release artifacts
        run: npm run release:pack

      - name: Sign release manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY_SHA256: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY_SHA256 }}
        run: npm run release:sign

      - name: Verify signed artifact checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      - name: Upload validated artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: validate-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.ref_name }}
          path: release-assets

      - name: Verify artifact checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      - name: Create stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.tar.gz \
            release-assets/manifest.json \
            release-assets/manifest.json.sig \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "Lenovo Store Operations v${{ needs.validate-and-package.outputs.version }}" \
            --generate-notes
